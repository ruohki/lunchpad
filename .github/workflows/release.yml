name: Release

# Tag a commit `vX.Y.Z` (matching the version in package.json, Cargo.toml and
# tauri.conf.json) to build macOS (Apple Silicon + Intel) and Windows, sign the
# updater artifacts and publish a draft GitHub release with `latest.json`.
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY            updater signing key (contents of ~/.tauri/lunchpad.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password (empty if the key has none)
# Optional: tell the docs site and the community hub about the release, so each opens a
# pull request that syncs its action data (tools/actions-contract.ts is attached to every
# release as actions.json):
#   SYNC_TOKEN                           a fine-grained token for ruohki/lunchpad-docs and
#                                        ruohki/lunchpad-hub with Contents: read and write
# Optional secrets for a signed and notarized macOS build:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD   Developer ID Application .p12 as base64 + password
#   APPLE_SIGNING_IDENTITY                          e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_CONTENT   App Store Connect API key id, issuer id and .p8 contents
# Optional Windows code signing, first match wins:
#   1. Azure Artifact Signing, formerly Trusted Signing (public trust, what users should get):
#        secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   app registration with the
#                  "Trusted Signing Certificate Profile Signer" role on the signing account
#        variables AZURE_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net),
#                  AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#   2. A .pfx certificate: secrets WINDOWS_CERTIFICATE (base64) + WINDOWS_CERTIFICATE_PASSWORD.
#      A self-signed one exercises the pipeline but Windows still shows "Unknown publisher".
#   With neither, the executable and installer stay unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version and create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in tauri.conf.json ($version)."
            exit 1
          fi
          # The build jobs attach their artifacts to this draft; creating it once, up front,
          # keeps three parallel jobs from racing to create it and gives a clear error if the
          # token cannot create releases.
          if gh release list --json tagName,isDraft --jq ".[] | select(.tagName == \"$tag\")" | grep -q tagName; then
            echo "Release $tag already exists, the build jobs will attach to it."
          else
            gh release create "$tag" --draft --title "Lunchpad $tag" --target "$GITHUB_SHA" \
              --notes "Download the installer for your system below. Installed copies update themselves."
            echo "Created draft release $tag."
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Attach the action contract, which the docs and the hub sync from
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bun tools/actions-contract.ts --check
          bun tools/actions-contract.ts --out actions.json
          gh release upload "$tag" actions.json --clobber

  build:
    name: Build (${{ matrix.target }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: bun install --frozen-lockfile

      - name: Apple signing and notarization (only when the secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          # Tauri treats an empty variable as set, so only export the ones that have a value.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Windows code signing (only when the secrets exist)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Tauri signs the .exe and the NSIS installer itself when the bundle config names a
          # certificate or a sign command. Tauri merges src-tauri/tauri.windows.conf.json into
          # the config on Windows, so the signing settings are written there for this run only:
          # tauri.conf.json stays clean, local builds never try to sign, and the file is
          # gitignored.
          $config = "src-tauri/tauri.windows.conf.json"
          if ($env:AZURE_CLIENT_SECRET -and $env:AZURE_SIGNING_ACCOUNT) {
            foreach ($name in "AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_SIGNING_ENDPOINT", "AZURE_SIGNING_PROFILE") {
              if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) { throw "$name is missing" }
            }
            # artifact-signing-cli (formerly trusted-signing-cli) wraps signtool with Microsoft's
            # signing dlib and reads AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET.
            # The Windows SDK signtool and the .NET runtime it needs are on the hosted runner.
            cargo install artifact-signing-cli --locked
            $cmd = "artifact-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE %1"
            @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Compress -Depth 5 | Set-Content -Path $config -Encoding ascii
            Write-Host "Signing with Azure Artifact Signing account $env:AZURE_SIGNING_ACCOUNT, profile $env:AZURE_SIGNING_PROFILE"
          }
          elseif ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
            } } } | ConvertTo-Json -Compress -Depth 5 | Set-Content -Path $config -Encoding ascii
            Write-Host "Signing with certificate $($cert.Subject) ($($cert.Thumbprint))"
          }
          else {
            Write-Host "No signing secrets: the executable and installer stay unsigned."
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Lunchpad v__VERSION__"
          releaseBody: "Download the installer for your system below. Installed copies update themselves."
          releaseDraft: true
          # Release candidates are published as normal releases on purpose: the updater reads
          # releases/latest/download/latest.json, and GitHub's "latest" skips pre-releases, so a
          # flagged rc would be invisible to installed copies. Semver ordering still holds:
          # 1.0.0-rc.1 updates 1.0.0-rc.0, and 1.0.0 updates every rc.
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Notarize and staple the DMG (only when the secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tauri notarizes and staples the .app, but the disk image around it is only signed.
        # macOS also checks the image when it is opened, so the DMG gets its own ticket and
        # replaces the copy tauri-action already uploaded to the draft release.
        run: |
          if [ -z "$APPLE_API_KEY_PATH" ]; then
            echo "No notarization credentials: the DMG stays as built."
            exit 0
          fi
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            gh release upload "$tag" "$dmg" --clobber
          done

  sync:
    name: Tell the docs and the hub
    needs: [draft, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a sync to lunchpad-docs and lunchpad-hub
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "No SYNC_TOKEN secret: the docs and the hub are not told about $TAG (see the notes at the top of this workflow)."
            exit 0
          fi
          for repo in ruohki/lunchpad-docs ruohki/lunchpad-hub; do
            GH_TOKEN="$SYNC_TOKEN" gh api "repos/$repo/dispatches" -f event_type=lunchpad-release -f "client_payload[version]=${TAG#v}" -f "client_payload[tag]=$TAG"
            echo "Told $repo about $TAG."
          done
