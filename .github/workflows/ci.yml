name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Action contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Every action has a name, a description, an icon and a JSON payload
        run: bun tools/actions-contract.ts --check

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu, like the release, so its glibc baseline is tested.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # WebKitGTK and GTK for the window, AppIndicator for the tray, ALSA for MIDI and sound,
        # Speech Dispatcher for text to speech (its bindings run bindgen, hence libclang), D-Bus
        # for the Secret Service.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libspeechd-dev libdbus-1-dev libxkbcommon-dev libclang-dev
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A failed job still saves its compiled dependencies, so a fix does not start cold.
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Type check and build the interface
        run: bun run build
      - name: Build the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run
      - name: Give the Windows test binaries an application manifest
        if: runner.os == 'Windows'
        shell: pwsh
        # tauri-build embeds the manifest that enables Common Controls v6 into the app binary
        # only. A test binary without it binds Common Controls v5, cannot resolve
        # TaskDialogIndirect and dies with STATUS_ENTRYPOINT_NOT_FOUND before any test runs.
        # Windows reads a "<name>.exe.manifest" file next to an executable that has none
        # embedded, so one is written beside every test binary.
        run: |
          $manifest = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@
          # Cargo says where the test executables are: newer toolchains keep them under
          # target/debug/build/<package>/<hash>/out instead of target/debug/deps. Asking again
          # compiles nothing; the previous step built them.
          $exes = cargo test --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq "compiler-artifact" -and $_.executable } |
            ForEach-Object { $_.executable }
          if (-not $exes) { throw "cargo reported no test executables" }
          foreach ($exe in $exes) {
            Set-Content -Path "$exe.manifest" -Value $manifest -Encoding utf8
            Write-Host "manifest for $exe"
          }
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
