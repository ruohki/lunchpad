[package]
name = "lunchpad"
version = "1.0.0-rc.3"
license = "GPL-3.0-only"
description = "Macro application for Novation Launchpads"
authors = ["Tillmann Hübner"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lunchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
thiserror = "2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "net", "io-util"] }
tokio-util = "0.7"
enigo = "0.5"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
rodio = { version = "0.21", features = ["symphonia-all"] }
tts = "0.26.3"
obws = { version = "0.15.0", features = ["events"] }
tokio-stream = "0.1"
os_info = { version = "3", default-features = false }
shlex = "2.0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
mime_guess = "2"
boa_engine = "0.22.0"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
